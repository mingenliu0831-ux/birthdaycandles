<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Birthday Cake 🎂</title>
    <link rel="stylesheet" href="style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap"
      rel="stylesheet"
    />

    <style>
      #mainTitle {
        font-size: 32px;
        font-family: 'Pixelify Sans', sans-serif;
        margin-bottom: 8px;
      }

      #subTitle {
        font-size: 18px;
        font-family: 'Pixelify Sans', sans-serif;
        color: #555;
      }

      #blowButton {
        margin-top: 20px;
        padding: 12px 18px;
        border-radius: 12px;
        border: none;
        cursor: pointer;
        font-family: 'Pixelify Sans', sans-serif;
        font-size: 16px;
        background: #ffb6c1;
        color: white;
      }

      #countdown {
        margin-top: 20px;
        font-size: 48px;
        font-family: 'Pixelify Sans', sans-serif;
        color: #ff7f9c;
      }

      .candle.blown::before,
      .candle.blown::after {
        display: none !important;
        opacity: 0 !important;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div id="birthdayText"></div>

      <div class="cake-container">
        <div class="cake" id="cake"></div>
      </div>

      <button id="blowButton">Click to blow out candles</button>

      <div id="countdown"></div>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const name = params.get("name") || "Shuman Zheng";

      let candleCount = parseInt(params.get("candles")) || 20;
      candleCount = Math.min(Math.max(candleCount, 1), 30);

      const birthdayText = document.getElementById("birthdayText");

      birthdayText.innerHTML = `
        <div id="mainTitle">Happy Birthday, ${name}!</div>
        <div id="subTitle">Make a wish, then click the button!</div>
      `;

      const cake = document.getElementById("cake");

      const colors = [
        "green-candle",
        "purple-candle",
        "blue-candle",
        "yellow-candle",
      ];

      const CAKE_VISUAL_WIDTH = 35;

      function createCandles(count) {
        cake.innerHTML = "";

        const CANDLE_VISUAL_WIDTH = 2;
        const availableWidth = CAKE_VISUAL_WIDTH;
        const candlesPerRow = 6;
        const shiftAmount = 4;

        for (let i = 0; i < count; i++) {
          const candle = document.createElement("div");
          candle.classList.add("candle");

          const colorClass = colors[Math.floor(Math.random() * colors.length)];
          candle.classList.add(colorClass);

          const row = Math.floor(i / candlesPerRow);
          const col = i % candlesPerRow;

          const totalCandlesInRow = Math.min(
            candlesPerRow,
            count - row * candlesPerRow
          );

          const rowSpacing = availableWidth / (totalCandlesInRow + 1);

          const leftBase = rowSpacing * (col + 1) - CANDLE_VISUAL_WIDTH / 2 + 5;
          const rowShift = row % 2 === 0 ? 0 : shiftAmount;

          candle.style.position = "absolute";
          candle.style.top = `${10 + row * 3}px`;
          candle.style.left = `${leftBase - rowShift + 4}px`;

          cake.appendChild(candle);
        }
      }

      createCandles(candleCount);

      function showLetterPage() {
        document.body.innerHTML = `
          <div style="
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff3f3;
            padding: 30px;
            font-family: 'Pixelify Sans', sans-serif;
          ">
            <div style="
              max-width: 650px;
              background: white;
              padding: 35px;
              border-radius: 20px;
              box-shadow: 0 8px 25px rgba(0,0,0,0.15);
              line-height: 1.6;
              color: #333;
            ">
              <h1 style="text-align: center;">Dear ${name},</h1>

              <p>
                Happy birthday!! I hope today brings you lots of happiness,
                warmth, and beautiful memories.
              </p>

              <p>
                I’m really grateful to know you, and I hope this little birthday
                cake page can make you smile.
              </p>

              <p>
                Wishing you love, luck, joy, and everything good in the new year
                of your life.
              </p>

              <p style="text-align: right; margin-top: 30px;">
                With love,<br>
                Your friend 💗
              </p>
            </div>
          </div>
        `;
      }

      function startCountdown() {
        const countdown = document.getElementById("countdown");
        let number = 5;

        countdown.textContent = number;

        const timer = setInterval(() => {
          number--;

          if (number > 0) {
            countdown.textContent = number;
          } else {
            clearInterval(timer);
            showLetterPage();
          }
        }, 1000);
      }

      function blowOutCandles() {
        const candles = document.querySelectorAll(".candle");
        const blowButton = document.getElementById("blowButton");

        blowButton.style.display = "none";

        candles.forEach((candle) => {
          const delay = Math.random() * 1000;

          setTimeout(() => {
            candle.classList.add("blown");
          }, delay);
        });

        setTimeout(() => {
          const subTitle = document.getElementById("subTitle");
          subTitle.textContent = "Get ready for your letter 💗";
          startCountdown();
        }, 1200);
      }

      const blowButton = document.getElementById("blowButton");
      blowButton.addEventListener("click", blowOutCandles);
    </script>
  </body>
</html>
