<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Birthday Cake 🎂</title>
    <link rel="stylesheet" href="style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
    href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=ZCOOL+KuaiLe&display=swap"
    rel="stylesheet"
    />

    <style>
      #mainTitle {
        font-size: 32px;
        font-family: 'Pixelify Sans', sans-serif;
        margin-bottom: 8px;
      }

      #subTitle {
        font-size: 18px;
        font-family: 'Pixelify Sans', sans-serif;
        color: #555;
      }

      #blowButton {
        margin-top: 20px;
        padding: 12px 18px;
        border-radius: 12px;
        border: none;
        cursor: pointer;
        font-family: 'Pixelify Sans', sans-serif;
        font-size: 16px;
        background: #ffb6c1;
        color: white;
      }

      #countdown {
        margin-top: 20px;
        font-size: 48px;
        font-family: 'Pixelify Sans', sans-serif;
        color: #ff7f9c;
      }

      .candle.blown::before,
      .candle.blown::after {
        display: none !important;
        opacity: 0 !important;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div id="birthdayText"></div>

      <div class="cake-container">
        <div class="cake" id="cake"></div>
      </div>

      <button id="blowButton">Click to blow out candles</button>

      <div id="countdown"></div>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const name = params.get("name") || "Shuman Zheng";

      let candleCount = parseInt(params.get("candles")) || 20;
      candleCount = Math.min(Math.max(candleCount, 1), 30);

      const birthdayText = document.getElementById("birthdayText");

      birthdayText.innerHTML = `
        <div id="mainTitle">Happy Birthday, ${name}!</div>
        <div id="subTitle">Make a wish, then click the button!</div>
      `;

      const cake = document.getElementById("cake");

      const colors = [
        "green-candle",
        "purple-candle",
        "blue-candle",
        "yellow-candle",
      ];

      const CAKE_VISUAL_WIDTH = 35;

      function createCandles(count) {
        cake.innerHTML = "";

        const CANDLE_VISUAL_WIDTH = 2;
        const availableWidth = CAKE_VISUAL_WIDTH;
        const candlesPerRow = 6;
        const shiftAmount = 4;

        for (let i = 0; i < count; i++) {
          const candle = document.createElement("div");
          candle.classList.add("candle");

          const colorClass = colors[Math.floor(Math.random() * colors.length)];
          candle.classList.add(colorClass);

          const row = Math.floor(i / candlesPerRow);
          const col = i % candlesPerRow;

          const totalCandlesInRow = Math.min(
            candlesPerRow,
            count - row * candlesPerRow
          );

          const rowSpacing = availableWidth / (totalCandlesInRow + 1);

          const leftBase = rowSpacing * (col + 1) - CANDLE_VISUAL_WIDTH / 2 + 5;
          const rowShift = row % 2 === 0 ? 0 : shiftAmount;

          candle.style.position = "absolute";
          candle.style.top = `${10 + row * 3}px`;
          candle.style.left = `${leftBase - rowShift + 4}px`;

          cake.appendChild(candle);
        }
      }

      createCandles(candleCount);

      function showLetterPage() {
        document.body.innerHTML = `
          <div style="
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff3f3;
            padding: 30px;
            font-family: 'ZCOOL KuaiLe', 'Pixelify Sans', sans-serif;
          ">
            <div style="
              max-width: 650px;
              background: white;
              padding: 35px;
              border-radius: 20px;
              box-shadow: 0 8px 25px rgba(0,0,0,0.15);
              line-height: 1.6;
              color: #333;
            ">
              <h1 style="text-align: center;">Dear ${name},</h1>

              <p>
                二十岁生日快乐！！ 非常希望你在巴黎能够度过一个难忘的二十岁生日！
              </p>

              <p>
                我记得你前两天刚告诉我，你给某人道歉的时候手搓了一个网站，这就是理工女的浪漫。虽然我很讨厌coding，但我也想要展现给你一个有点萌萌的、我猜你会喜欢的小惊喜。
                所以我就怒花了四个小时，且在明天有mt还一点都没复习的情况下做了这个大工程。。。我们好像总是这样。阴差阳错的miss了许多重要的事情，像纽约的班机、错开的放假时间、
                申请的转学。但我始终希望怎么样都没关系，我们都经历这么多了，没有什么能把我们分离。但是我依旧很遗憾，没办法陪在你身边和你切身经历着对你来说很重要的两年。实际上，
                我深切地希望以后我们可以永远永远在对方身边，最好近一点。不过没什么可担心的，反正我们的爱能克服远距离❤️

              <p>
                我想对你说，你总是在我缺乏信心和伤心难过的时候出现在我脑海里。我想着我们一起度过的那些痛苦心酸和刺激快乐的时光，我就会觉得这些就是存在的意义，好像其他的也能忍着也没关系了。
                你对我来说已经不止于是朋友/爱情/亲情的意义了，而且我们又没有血缘关系（和荷尔蒙？？）的兜底，真的，不知道该感慨什么。
                所以，亲爱的证书满，不管你这段时间经历的所有事让你觉得多么的自我怀疑，我希望你至少记着你给我带来了多大的意义。如果你在乎我的话，那你就相信我说的：你真的是我见过最最善良真诚，又闪闪发光的人类了。
                在Bates这种小破地方你居然都能够适应的这么好，还觉得大家人都很好，其实是因为你本身就无与伦比的棒才会能够感知到这些细小的幸福，而你也真的deserve这种旺你的环境。
                我知道离开这件事有多么的难承受，但请一定相信，像你这样的人，去Umich也好还是其他你选择的学校，一定都会吸引到美丽的事物，因为你就是！
                
              </p>
              
              <p>
                还有，最重要的，你值得所有你想要的事.
              </p>

              <p style="text-align: right; margin-top: 30px;">
                With love and wish you the best,<br>
                Alexandra Liu 💗
              </p>
            </div>
          </div>
        `;
      }

      function startCountdown() {
        const countdown = document.getElementById("countdown");
        let number = 5;

        countdown.textContent = number;

        const timer = setInterval(() => {
          number--;

          if (number > 0) {
            countdown.textContent = number;
          } else {
            clearInterval(timer);
            showLetterPage();
          }
        }, 1000);
      }

      function blowOutCandles() {
        const candles = document.querySelectorAll(".candle");
        const blowButton = document.getElementById("blowButton");

        blowButton.style.display = "none";

        candles.forEach((candle) => {
          const delay = Math.random() * 1000;

          setTimeout(() => {
            candle.classList.add("blown");
          }, delay);
        });

        setTimeout(() => {
          const subTitle = document.getElementById("subTitle");
          subTitle.textContent = "Get ready for your letter 💗";
          startCountdown();
        }, 1200);
      }

      const blowButton = document.getElementById("blowButton");
      blowButton.addEventListener("click", blowOutCandles);
    </script>
  </body>
</html>
